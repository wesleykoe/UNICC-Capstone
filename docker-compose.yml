# docker-compose.yml
version: "3.9"

services:
  slm-platform:
    build: .
    container_name: unicc-slm
    ports:
      - "8000:8000"
    environment:
      - BASE_MODEL_ID=meta-llama/Llama-3.2-3B-Instruct
      - HF_TOKEN=${HF_TOKEN}                    # HuggingFace token (Option B: local Llama)
      - LLM_BACKEND=${LLM_BACKEND:-local}       # Set to "anthropic" for Claude backend
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}  # Required if LLM_BACKEND=anthropic
      - UNICC_DELIBERATION_ACTIVE=${UNICC_DELIBERATION_ACTIVE:-true}
    volumes:
      - hf-cache:/root/.cache/huggingface   # cache model weights across restarts
    restart: unless-stopped

volumes:
  hf-cache:
